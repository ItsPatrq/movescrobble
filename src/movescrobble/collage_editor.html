<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collage editor</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #141413; --panel: #1d1c1a; --panel2: #262522; --line: #38362f; --text: #ece9e1; --dim: #a5a196;
  --accent: #e9a15b; --accent2: #7fb7d9; --bad: #e07a6b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  display: grid; grid-template-rows: 44px 1fr; overflow: hidden; }
header { display: flex; align-items: center; gap: 8px; padding: 0 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
header h1 { font-size: 13px; margin: 0 8px 0 0; font-weight: 600; white-space: nowrap; }
header .spring { flex: 1; }
#status { color: var(--dim); min-width: 150px; text-align: right; white-space: nowrap; overflow: hidden; }
#status.bad { color: var(--bad); }
main { display: grid; grid-template-columns: 188px 1fr 330px; min-height: 0; }
button, select, input[type=text], input[type=number], textarea {
  font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px;
}
button { cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--dim); }
button:disabled { opacity: .4; cursor: default; }
button.on, button.primary { background: var(--accent); border-color: var(--accent); color: #1c1407; font-weight: 600; }
button.link { background: none; border: none; color: var(--accent2); padding: 2px 0; }
:focus-visible { outline: 2px solid var(--accent2); outline-offset: 1px; }
.group { display: flex; gap: 2px; }
.group button { border-radius: 0; }
.group button:first-child { border-radius: 5px 0 0 5px; }
.group button:last-child { border-radius: 0 5px 5px 0; }

#left { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
#versions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.version { position: relative; padding: 0; background: #000; border: 2px solid transparent; border-radius: 5px; overflow: hidden; aspect-ratio: 9 / 16; }
.version.current { border-color: var(--accent); }
.version img { width: 100%; height: 100%; object-fit: cover; display: block; }
.version span { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; padding: 8px 3px 2px; text-align: left;
  background: linear-gradient(transparent, #000c); color: #fff; }
.version i { position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

#centre { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: #0d0d0c; }
#tools { display: flex; flex-wrap: wrap; gap: 8px; padding: 7px 10px; align-items: center; border-bottom: 1px solid var(--line); background: var(--panel); }
#tools label { color: var(--dim); display: flex; gap: 4px; align-items: center; }
#stageWrap { flex: 1; min-height: 0; overflow: auto; display: flex; padding: 14px; }
#stage { position: relative; margin: auto; height: 100%; aspect-ratio: 9 / 16; background: #000; flex: none; box-shadow: 0 0 0 1px var(--line); touch-action: none; }
#view, #over { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
#over { overflow: hidden; }
.cut { fill: transparent; stroke: transparent; stroke-width: 2; cursor: grab; fill-rule: evenodd; vector-effect: non-scaling-stroke; }
.outlines .cut { stroke: #ffffff30; }
.cut:hover { stroke: #ffffff90; }
.cut.sel { stroke: var(--accent); stroke-width: 2; }
.cut.isbody.sel { stroke: var(--accent2); }
.handle { fill: #fff; stroke: #000; stroke-width: 1; cursor: move; vector-effect: non-scaling-stroke; }
.handle.mid { fill: var(--accent); }
.handle:hover { fill: var(--accent2); }
.box { fill: transparent; stroke: #ffffff30; stroke-dasharray: 8 8; stroke-width: 1; vector-effect: non-scaling-stroke; cursor: move; }
.box:hover { stroke: #ffffffa0; }
.box.sel { stroke: var(--accent); stroke-dasharray: none; stroke-width: 2; }
.safe { fill: #e07a6b30; pointer-events: none; }
.safeText { fill: #ffffffb0; font-size: 26px; pointer-events: none; }
.guide { stroke: #ffffff50; stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: none; }

#right { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#tabs { display: flex; border-bottom: 1px solid var(--line); }
#tabs button { flex: 1; border: none; border-radius: 0; background: none; color: var(--dim); padding: 9px 2px; border-bottom: 2px solid transparent; }
#tabs button.on { color: var(--text); font-weight: 600; border-bottom-color: var(--accent); }
#panel { overflow-y: auto; padding: 12px; flex: 1; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 16px 0 6px; font-weight: 600; }
h2:first-child { margin-top: 0; }
.row { display: grid; grid-template-columns: 82px 1fr 46px; align-items: center; gap: 6px; margin: 5px 0; }
.row input[type=range] { width: 100%; accent-color: var(--accent); }
.row output { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; font-size: 11px; }
.line { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; margin: 5px 0; }
.line label { color: var(--dim); }
.hint { color: var(--dim); font-size: 11px; margin: 4px 0; }
.layers { display: flex; flex-direction: column; gap: 2px; }
.layer { display: flex; align-items: center; gap: 5px; padding: 2px 4px; border: 1px solid transparent; border-radius: 5px; cursor: pointer; }
.layer:hover { background: var(--panel2); }
.layer.sel { border-color: var(--accent); background: var(--panel2); }
.layer img { width: 26px; height: 34px; object-fit: cover; border-radius: 3px; }
.layer span { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.layer button { padding: 0 5px; }
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.tile { padding: 0; aspect-ratio: 3 / 4; overflow: hidden; border: 2px solid transparent; background: #000; }
.tile.on { border-color: var(--accent); }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips button { font-size: 11px; padding: 2px 7px; border-radius: 10px; }
textarea { width: 100%; resize: vertical; min-height: 64px; }
select { max-width: 100%; }
video { width: 100%; border-radius: 5px; background: #000; margin-top: 6px; }
kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font: 10px ui-monospace, monospace; }
.exports { display: flex; flex-direction: column; gap: 3px; }
.meter { height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin: 6px 0; }
.meter div { height: 100%; width: 0; background: var(--accent); }
.crop { position: relative; margin: 14px auto 10px; background: #000; touch-action: none; }
.crop img { display: block; width: 100%; height: 100%; user-select: none; -webkit-user-drag: none; }
.crop svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }  /* a crop past the photo's edge stays in reach */
.crop .shade { fill: #000000b0; fill-rule: evenodd; pointer-events: none; }
.crop .window { fill: transparent; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; cursor: move; }
.crop .corner { fill: #fff; stroke: #000; stroke-width: 1; vector-effect: non-scaling-stroke; cursor: nwse-resize; }
#stage.dropping { box-shadow: 0 0 0 3px var(--accent2); }
@media (max-width: 1050px) { main { grid-template-columns: 130px 1fr 290px; } }
</style>
</head>
<body>
<header>
  <h1>Collage editor</h1>
  <div class="group">
    <button id="undo" title="Undo (⌘Z)" data-testid="undo">Undo</button>
    <button id="redo" title="Redo (⇧⌘Z)" data-testid="redo">Redo</button>
  </div>
  <button id="before" title="Hold to see this version as it was drawn (B)" data-testid="before">Before</button>
  <button id="revert" data-testid="revert">Revert version</button>
  <span class="spring"></span>
  <span id="share" class="hint" data-testid="share"></span>
  <span id="status" role="status" data-testid="status">Loading</span>
</header>
<main>
  <aside id="left">
    <div>
      <h2>Versions</h2>
      <div id="versions" data-testid="versions"></div>
    </div>
    <div>
      <h2>New version</h2>
      <div class="line"><select id="newLayout" aria-label="Layout" data-testid="new-layout"></select></div>
      <div class="line"><select id="newLook" aria-label="Look" data-testid="new-look"></select></div>
      <div class="line"><button id="draw" data-testid="draw">Draw</button></div>
      <p class="hint">Same photos, type and route, in a new composition. Your other versions stay.</p>
    </div>
  </aside>
  <section id="centre">
    <div id="tools">
      <div class="group" role="group" aria-label="Tool">
        <button data-tool="picture" title="Drag moves the photo inside its shape (1)" data-testid="tool-picture">Picture</button>
        <button data-tool="shape" title="Drag moves shapes and seams (2)" data-testid="tool-shape">Shape</button>
      </div>
      <label><input type="checkbox" id="seams" checked data-testid="link-seams"> Move touching seams together</label>
      <label><input type="checkbox" id="follow" checked data-testid="follow"> Picture follows shape</label>
      <label><input type="checkbox" id="stay" checked data-testid="stay"> Keep photo filling its shape</label>
      <label><input type="checkbox" id="safeZones" checked data-testid="safe-zones"> Instagram UI</label>
      <label><input type="checkbox" id="outlines" data-testid="outlines"> Outlines</label>
      <label>Zoom <select id="zoom" data-testid="zoom"><option value="1">Fit</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></label>
    </div>
    <div id="stageWrap">
      <div id="stage" data-testid="stage">
        <img id="view" alt="Preview of the collage" data-testid="view" draggable="false">
        <svg id="over" viewBox="0 0 1080 1920" data-testid="overlay" aria-label="Pieces of the collage"></svg>
      </div>
    </div>
  </section>
  <aside id="right">
    <div id="tabs" role="tablist"></div>
    <div id="panel" data-testid="panel"></div>
  </aside>
</main>
<input type="file" id="photoFile" accept="image/*,.heic,.heif" multiple hidden data-testid="add-photo-input">
<script>
"use strict";
const TOKEN = "__TOKEN__";
const S = {
  info: null, recipe: null, original: null, kind: "piece", sel: -1, tool: "picture", tab: "Pieces",
  undo: [], redo: [], last: "", boxes: [], thumbs: new Map(), reelFrames: null, playing: false, saving: Promise.resolve(),
};
const $ = (q) => document.querySelector(q);
const currentId = () => S.recipe && S.recipe.id;
const el = (tag, props = {}, ...kids) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const kid of kids) if (kid != null) node.append(kid);
  return node;
};
const clone = (v) => JSON.parse(JSON.stringify(v));

function setStatus(text, bad = false) {
  const node = $("#status");
  node.textContent = text;
  node.classList.toggle("bad", bad);
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-Token": TOKEN, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (!res.ok) {
    let message = res.statusText;
    try { message = (await res.json()).error || message; } catch (e) { /* not JSON */ }
    throw new Error(message);
  }
  return res;
}
const apiJson = async (path, body) => (await api(path, body)).json();
const photoUrl = (key, h = 160) => `/api/photo?t=${encodeURIComponent(TOKEN)}&h=${h}&key=${encodeURIComponent(key)}`;

// --- preview: one request at a time; the newest change wins; sharper when you stop

let busy = false, again = false, sharpTimer = null, interacting = false, settled = Promise.resolve(), settle = null;

function requestPreview() {
  clearTimeout(sharpTimer);
  if (!settle) settled = new Promise((resolve) => { settle = resolve; });
  if (busy) { again = true; return; }
  pump(0.34);
}

function sharpenAfter(ms) {
  sharpTimer = setTimeout(() => { if (interacting) sharpenAfter(200); else pump(0.8); }, ms);
}

// What the page shows. A picture nobody else keeps goes when the next one comes; thumbnails, frames and Before stay.
let passing = null;
function show(url, kept = false) {
  $("#view").src = url;
  if (passing) URL.revokeObjectURL(passing);
  passing = kept ? null : url;
}

async function pump(scale) {
  busy = true;
  try {
    do {
      again = false;
      const recipe = S.recipe;
      const res = await api("/api/preview", { recipe, scale });
      const info = JSON.parse(res.headers.get("X-Info"));
      const url = URL.createObjectURL(await res.blob());
      const view = $("#view");
      await new Promise((resolve) => { view.onload = resolve; view.onerror = resolve; show(url); });
      if (recipe === S.recipe) {
        S.boxes = info.boxes;
        $("#share").textContent = info.share ? `legs ${(info.share * 100).toFixed(0)}% of frame` : "";
        drawOverlay();
      }
      if (again) scale = 0.34;
    } while (again);
    setStatus(S.dirty ? "Saving…" : "Saved");
  } catch (error) {
    setStatus(error.message, true);
  }
  busy = false;
  if (again) return pump(0.34);
  if (scale < 0.8) sharpenAfter(180);
  else if (settle) { settle(); settle = null; }
}

// --- changes: every one reaches the preview and is saved; a finished gesture becomes an undo step

let saveTimer = null;
function touched() {
  S.dirty = true;
  dropReelFrames();
  drawOverlay();
  if (S.cropRedraw) S.cropRedraw();
  requestPreview();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 500);
}
function dropReelFrames() {
  (S.reelFrames || []).forEach((url) => URL.revokeObjectURL(url));
  S.reelFrames = null;
}
function changed() { touched(); commit(); renderPanel(); }
function save() {
  if (S.dirty) {
    S.dirty = false;
    const recipe = S.recipe;
    S.saving = S.saving.then(() => send(recipe));
  }
  return S.saving;
}
async function send(recipe) {
  try {
    await api("/api/save", { recipe });
    const row = S.info.versions.find((v) => v.id === recipe.id);
    if (row && !row.edited) { row.edited = true; renderVersions(); updateButtons(); }
    if (!busy) setStatus("Saved");
  } catch (error) { setStatus(error.message, true); }
}
function commit() {
  const now = JSON.stringify(S.recipe);
  if (now === S.last) return;
  S.undo.push(S.last);
  if (S.undo.length > 200) S.undo.shift();
  S.redo = [];
  S.last = now;
  updateButtons();
}
function restore(text) {
  S.recipe = JSON.parse(text);
  S.last = text;
  if (S.kind === "piece" && S.sel >= S.recipe.pieces.length) S.sel = -1;
  if (S.kind === "text" && S.sel >= (S.recipe.text || []).length) { S.kind = "piece"; S.sel = -1; }
  updateButtons();
  renderPanel();
  touched();
}
function undo() { if (S.undo.length) { S.redo.push(S.last); restore(S.undo.pop()); } }
function redo() { if (S.redo.length) { S.undo.push(S.last); restore(S.redo.pop()); } }
function updateButtons() {
  $("#undo").disabled = !S.undo.length;
  $("#redo").disabled = !S.redo.length;
  const row = S.info && S.info.versions.find((v) => v.id === currentId());
  $("#revert").disabled = !S.original || !(row && row.edited);
}

// --- shapes as SVG paths, to pick and to show what is selected

function circle(cx, cy, r) {
  return `M${cx - r} ${cy}A${r} ${r} 0 1 0 ${cx + r} ${cy}A${r} ${r} 0 1 0 ${cx - r} ${cy}Z`;
}
function shapePath(s) {
  switch (s.type) {
    case "full": return `M0 0H${S.info.frame.w}V${S.info.frame.h}H0Z`;
    case "noise": return `M0 0H${S.info.frame.w}V${S.info.frame.h}H0Z`;
    case "poly": return "M" + s.points.map((p) => `${p[0]} ${p[1]}`).join("L") + "Z";
    case "disc": return circle(s.cx, s.cy, s.r);
    case "ring": {
      if (s.sweep === undefined) return circle(s.cx, s.cy, s.r1) + circle(s.cx, s.cy, s.r0);
      const at = (r, a) => `${s.cx + r * Math.cos(a)} ${s.cy + r * Math.sin(a)}`;
      const end = s.start + s.sweep, large = s.sweep > Math.PI ? 1 : 0;
      return `M${at(s.r1, s.start)}A${s.r1} ${s.r1} 0 ${large} 1 ${at(s.r1, end)}L${at(s.r0, end)}A${s.r0} ${s.r0} 0 ${large} 0 ${at(s.r0, s.start)}Z`;
    }
    case "arch": {
      const r = (s.x1 - s.x0) / 2;
      return `M${s.x0} ${s.bottom}V${s.top + r}A${r} ${r} 0 0 1 ${s.x1} ${s.top + r}V${s.bottom}Z`;
    }
    case "union": return s.parts.map(shapePath).join("");
    case "minus": return shapePath(s.base);
    default: return "";
  }
}
function moveShape(s, dx, dy) {
  switch (s.type) {
    case "poly": s.points.forEach((p) => { p[0] += dx; p[1] += dy; }); break;
    case "disc": case "ring": s.cx += dx; s.cy += dy; break;
    case "arch": s.x0 += dx; s.x1 += dx; s.top += dy; s.bottom += dy; break;
    case "union": s.parts.forEach((part) => moveShape(part, dx, dy)); break;
    case "minus": moveShape(s.base, dx, dy); break;
    default: break;
  }
}
const NS = "http://www.w3.org/2000/svg";
const svg = (tag, attrs = {}) => {
  const node = document.createElementNS(NS, tag);
  for (const [name, value] of Object.entries(attrs)) node.setAttribute(name, value);
  return node;
};

function drawOverlay() {
  const over = $("#over");
  if (!S.recipe) return;
  over.replaceChildren();
  over.classList.toggle("outlines", $("#outlines").checked);
  S.recipe.pieces.forEach((piece, i) => {
    if (piece.visible === false) return;
    const selected = S.kind === "piece" && S.sel === i;
    const path = svg("path", { d: shapePath(piece.shape), class: `cut${selected ? " sel" : ""}${piece.body ? " isbody" : ""}` });
    path.dataset.role = "piece";
    path.dataset.index = i;
    path.dataset.testid = `piece-${i}`;
    over.append(path);
  });
  if (S.recipe.route && S.recipe.route.visible !== false) {
    const r = S.recipe.route;
    const box = svg("rect", { x: r.x - 8, y: r.y - 8, width: r.w + 16, height: r.h + 16, class: `box${S.kind === "route" ? " sel" : ""}` });
    box.dataset.role = "route";
    box.dataset.testid = "route-box";
    over.append(box);
    if (S.kind === "route") over.append(handle(r.x + r.w + 8, r.y + r.h + 8, "routeSize", 0));
  }
  (S.recipe.text || []).forEach((block, i) => {
    if (block.visible === false || !S.boxes[i]) return;
    const [x, y, w, h] = S.boxes[i];
    const selected = S.kind === "text" && S.sel === i;
    const box = svg("rect", { x: x - 6, y: y - 6, width: w + 12, height: h + 12, class: `box${selected ? " sel" : ""}` });
    box.dataset.role = "text";
    box.dataset.index = i;
    box.dataset.testid = `text-box-${i}`;
    over.append(box);
    if (selected) over.append(handle(x + w + 6, y + h + 6, "textSize", i));
  });
  if (S.tool === "shape" && S.kind === "piece" && S.sel >= 0) drawHandles(S.recipe.pieces[S.sel].shape);
  if ($("#safeZones").checked) {
    const f = S.info.frame;
    for (const [x, y, w, h, words] of [[0, 0, f.w, f.top, "profile"], [0, f.h - f.bottom, f.w, f.bottom, "caption"], [f.w - f.right, f.top, f.right, f.h - f.top - f.bottom, ""]]) {
      over.append(svg("rect", { x, y, width: w, height: h, class: "safe" }));
      if (words) { const t = svg("text", { x: x + 14, y: y + 34, class: "safeText" }); t.textContent = words; over.append(t); }
    }
  }
  if (S.guides) for (const [x1, y1, x2, y2] of S.guides) over.append(svg("line", { x1, y1, x2, y2, class: "guide" }));
}

function handle(x, y, kind, index, mid = false) {
  const node = svg("circle", { cx: x, cy: y, r: 13, class: `handle${mid ? " mid" : ""}` });
  node.dataset.role = "handle";
  node.dataset.kind = kind;
  node.dataset.index = index;
  node.dataset.testid = `handle-${kind}-${index}`;
  return node;
}

function drawHandles(s) {
  const over = $("#over");
  if (s.type === "poly") {
    s.points.forEach((p, i) => {
      over.append(handle(p[0], p[1], "vertex", i));
      const q = s.points[(i + 1) % s.points.length];
      over.append(handle((p[0] + q[0]) / 2, (p[1] + q[1]) / 2, "edge", i, true));
    });
  } else if (s.type === "disc" || (s.type === "union" && s.parts[0].type === "disc")) {
    const d = s.type === "union" ? s.parts[0] : s;
    over.append(handle(d.cx, d.cy, "centre", 0));
    over.append(handle(d.cx - d.r, d.cy, "radius", 0, true));
  } else if (s.type === "ring") {
    const mid = s.sweep === undefined ? Math.PI : s.start + s.sweep / 2;
    const at = (r, a = mid) => [s.cx + r * Math.cos(a), s.cy + r * Math.sin(a)];
    const r1 = Math.min(s.r1, Math.hypot(s.cx, s.cy));
    over.append(handle(...at(s.r0), "r0", 0, true));
    over.append(handle(...at(r1), "r1", 0, true));
    if (s.sweep !== undefined) {
      const r = (s.r0 + r1) / 2;
      over.append(handle(...at(r, s.start), "start", 0));
      over.append(handle(...at(r, s.start + s.sweep), "end", 0));
    }
  } else if (s.type === "arch") {
    const mx = (s.x0 + s.x1) / 2, my = (s.top + s.bottom) / 2;
    over.append(handle(s.x0, my, "x0", 0, true));

    return [[b.x0, b.y0], [b.x1, b.y0], [b.x1, b.y1], [b.x0, b.y1]].map(([x, y]) => {

  const piece = S.kind === "piece" && S.sel >= 0 ? S.recipe.pieces[S.sel] : null;
  const step = event.shiftKey ? 10 : 1;
  const arrows = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (event.key in arrows && event.target.type !== "range") {
    event.preventDefault();
    const [dx, dy] = arrows[event.key];
    if (piece) {
      if (S.tool === "shape") { moveShape(piece.shape, dx, dy); if ($("#follow").checked) slideMap(piece.map, dx, dy); }
      else { slideMap(piece.map, dx, dy); keepFilling(S.sel); }
    } else if (S.kind === "text" && S.recipe.text[S.sel]) { S.recipe.text[S.sel].x += dx; S.recipe.text[S.sel].y += dy; }
    else if (S.kind === "route" && S.recipe.route) { S.recipe.route.x += dx; S.recipe.route.y += dy; }
    touched();
    clearTimeout(S.keyEnd);
    S.keyEnd = setTimeout(commit, 400);
    return;
  }
  if (event.key === "1") setTool("picture");
  else if (event.key === "2") setTool("shape");
  else if (event.key.toLowerCase() === "b" && !event.repeat) showBefore(true);
  else if (event.key === "Tab") {
    event.preventDefault();

}
async function start() {

    const layouts = $("#newLayout");
    S.info.layouts.forEach((name) => layouts.append(el("option", { value: name, textContent: name })));
    const looks = $("#newLook");
    S.info.looks.forEach((name) => looks.append(el("option", { value: name, textContent: name })));
    const over = $("#over");
    over.addEventListener("pointerdown", startDrag);
    over.addEventListener("pointermove", moveDrag);
    over.addEventListener("pointerup", endDrag);
    over.addEventListener("pointercancel", endDrag);
    over.addEventListener("wheel", wheel, { passive: false });
    const stage = $("#stage");
    stage.addEventListener("dragover", (event) => {
      if (![...event.dataTransfer.types].includes("Files")) return;
      event.preventDefault();
      stage.classList.add("dropping");
    });
    stage.addEventListener("dragleave", () => stage.classList.remove("dropping"));
    stage.addEventListener("drop", (event) => {
      event.preventDefault();
      stage.classList.remove("dropping");
      const role = event.target.dataset && event.target.dataset.role;
      const target = role === "piece" ? Number(event.target.dataset.index) : null;
      if (target !== null) select("piece", target);
      addPhotos([...event.dataTransfer.files], target);
    });
    $("#photoFile").onchange = async () => {
      const files = [...$("#photoFile").files];
      $("#photoFile").value = "";
      await addPhotos(files, photoTarget);
    };
    document.addEventListener("keydown", keydown);
    document.addEventListener("keyup", (event) => { if (event.key.toLowerCase() === "b") showBefore(false); });
    document.querySelectorAll("[data-tool]").forEach((b) => { b.onclick = () => setTool(b.dataset.tool); });
    $("#undo").onclick = undo;
    $("#redo").onclick = redo;
    $("#revert").onclick = revertVersion;
    $("#draw").onclick = drawNew;
    const before = $("#before");
    before.onpointerdown = () => showBefore(true);
    before.onpointerup = before.onpointerleave = () => showBefore(false);
    for (const id of ["#safeZones", "#outlines"]) $(id).onchange = drawOverlay;
    $("#zoom").onchange = () => {
      const zoom = Number($("#zoom").value), stage = $("#stage"), wrap = $("#stageWrap");
      stage.style.height = zoom === 1 ? "" : `${(wrap.clientHeight - 28) * zoom}px`;
    };
    window.addEventListener("pagehide", () => {
      if (S.dirty) fetch("/api/save", { method: "POST", keepalive: true, headers: { "X-Token": TOKEN }, body: JSON.stringify({ recipe: S.recipe }) });
    });
    renderTabs();
    setTool("picture");
    await loadVersion(S.info.versions[0].id);
  } catch (error) { setStatus(error.message, true); }
}
window.__editor = { S, idle: () => settled.then(() => undefined), saved: () => S.saving, commit, touched };
start();
